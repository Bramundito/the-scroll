
name: THE SCROLL — Free Source Edition

on:
  schedule:
    # 08:19 Jakarta time = 01:19 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy current edition or collect fresh publisher feeds?'
        type: choice
        required: true
        default: 'generate'
        options:
          - generate
          - deploy-only

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: the-scroll-daily-deploy
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect free publisher news
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'generate'
        run: python collect-news.py

      - name: Validate articles and source links
        run: node validate-news.mjs

      - name: Save news.json to main
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'generate'
        run: |
          git config user.name 'the-scroll-news-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily free source-first edition"
            git push origin HEAD:main
          fi

      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html app.js styles.css news.json _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          
      - name: Allow GitHub artifact to become available
        run: sleep 20

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

