<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf8f2">
  <meta name="description" content="THE SCROLL — one story, one screen, full context.">
  <title>THE SCROLL — One story at a time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="masthead" aria-label="Reader header">
      <a class="logo" href="#story-0" id="homeLink" aria-label="Go to first story"><span class="logo-symbol" aria-hidden="true">✳</span>THE SCROLL<span class="logo-stop">.</span></a>
      <div class="edition-heading"><span class="edition-label">THE DAILY EDITION</span><span class="edition-date" id="editionDate">LOADING EDITION</span></div>
      <div class="masthead-right"><span class="no-noise"><span class="no-noise-dot" aria-hidden="true"></span> ONE STORY. FULL PICTURE.</span><span id="demoBadge" class="demo-badge">NEWS READER</span></div>
    </header>
    <div class="top-progress" aria-hidden="true"><div id="topProgressFill"></div></div>
    <main id="newsDeck" class="news-deck" aria-label="Today's news, one story per screen" tabindex="0"><div class="initial-load">Making room for the news <span>✳</span></div></main>
    <footer class="bottom-navigation" aria-label="Story navigation">
      <div class="nav-left"><span id="pageLabel" class="page-label">— <span class="slash">/</span> —</span><span id="currentCategory" class="nav-category">THE SCROLL</span></div>
      <div class="nav-center" id="pageDots" aria-label="Choose a story"></div>
      <div class="nav-right"><span class="nav-help">SCROLL <span aria-hidden="true">↓</span> OR USE ARROWS</span><button id="previousButton" class="nav-btn previous" type="button" aria-label="Previous story">← <span>PREVIOUS</span></button><button id="nextButton" class="nav-btn next" type="button">NEXT STORY <span aria-hidden="true">→</span></button></div>
    </footer>
    <div id="notice" class="screen-reader-status" aria-live="polite"></div>
  </div>
</body>
</html>
